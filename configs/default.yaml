experiment:
  name: two_tower_v2
  seed: 42

data:
  raw_path: data/raw/
  processed_path: data/processed/
  features_path: data/features/
  text_embeddings_path: data/features/text_embeddings/
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

model:
  student_tower:
    input_dim: 506           # 122 struct + 384 text
    hidden_dims: [256, 128]
    output_dim: 128
  scholarship_tower:
    input_dim: 509           # 125 struct + 384 text
    hidden_dims: [256, 128]
    output_dim: 128
  temperature: 0.1

training:
  epochs: 3
  batch_size: 256
  learning_rate: 1.0e-3
  loss: sampled_softmax_weighted

feedback_weights:
  accepted: 5.0
  apply: 2.0
  click: 1.0

evaluation:
  metrics: [recall@5, ndcg@5, mrr]
  k_values: [5]

serving:
  embedding_dim: 128
  retrieval: brute_force
  scholarship_emb_path: outputs/embeddings/scholarship_emb.npy
  scholarship_ids_path: outputs/embeddings/scholarship_ids.npy

output:
  checkpoint_dir: outputs/checkpoints/
  log_dir: outputs/logs/
  embedding_dir: outputs/embeddings/
