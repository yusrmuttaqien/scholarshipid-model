# Model checkpoint paths
models:
  student_tower: outputs/checkpoints/student_tower_best.keras
  scholarship_tower: outputs/checkpoints/scholarship_tower_best.keras

# Server configuration
server:
  host: 0.0.0.0
  port: 8000
  cors_origins: "*"  # Local: allow all. Production: restrict to specific domains (e.g., "https://scholarship.id")
  auth_required: false  # Local: false. Production: true to enable Bearer token auth on /refresh
  auth_token: ""  # Set this to a secret token for production auth

# Retraining configuration (used by /retrain endpoint)
# By default, all feedback data is used for training (no chronological split).
# This ensures new/delta entries uploaded via /retrain are seen by the optimizer.
# Optional holdout_fraction can reserve a percentage of recent data for monitoring only.
retraining:
  holdout_fraction: 0.0   # 0.0 = use all data for training, 0.20 = hold out last 20%
